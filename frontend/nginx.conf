server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带哈希的构建产物可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 前端路由。/chat/xxx 这类路径在磁盘上没有对应文件，
    # 必须回落到 index.html 交给 react-router，否则刷新页面就是 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端限流按 IP 分桶，没有这个头的话所有请求的来源都是 nginx 本身，
        # 等于全站共用一个配额
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ↓↓↓ 这三行是 SSE 流式回答能用的前提 ↓↓↓
        # 开着缓冲的话，nginx 会把回答攒够一个缓冲区再整段发出去 ——
        # 「逐字输出」直接退化成「等半天然后一次性蹦出来」。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 大模型一次调用最长可以挂 120 秒（后端超时），网关不能比它先放弃
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 上传文件：默认 1M 会把 50M 的文档挡在门外
        client_max_body_size 60m;
    }
}
