# 一条命令把整套服务跑起来：
#
#     docker compose up --build
#
# 前端   http://localhost:5173
# 后端   http://localhost:8000/docs
#
# ⚠️ 未在本机实测。写这份文件时这台机器上没有装 Docker（`docker` 命令不存在），
#    所以没有经过任何一次真实构建。首次使用请按 backend/Dockerfile 与
#    frontend/Dockerfile 顶部列的三条逐一确认，跑通后把这几行删掉。
#
# 想不接大模型先跑通全链路 —— 压测模式下所有外部调用走确定性 mock，
# 不需要 API Key、不产生费用：
#
#     STRESS_TEST_MODE=true docker compose up --build
#
# 其余配置从仓库根的 .env 读（compose 会自动加载它），也可以直接写环境变量：
#     LLM_API_KEY=sk-xxx SECRET_KEY=xxx docker compose up --build

services:
  backend:
    build:
      context: ./backend
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen-plus}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-text-embedding-v3}
      # 不配 SECRET_KEY 的话，开发态会在每次启动时随机生成一个 ——
      # 容器一重启，所有已签发的 token 全部失效，表现为「刚登录就被登出」。
      # 生成一个：python -c "import secrets; print(secrets.token_urlsafe(48))"
      SECRET_KEY: ${SECRET_KEY:-}
      # 留空则首次启动随机生成管理员密码，并只在那一次的日志里打印
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STRESS_TEST_MODE: ${STRESS_TEST_MODE:-false}
      APP_ENV: ${APP_ENV:-development}
    volumes:
      # SQLite、Chroma 向量库、上传的原始文件都写在 /app/data 下。
      # 不挂出来的话，容器一重建数据就全没了。
      - backend-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      # 等后端健康检查通过再起 —— 否则首屏加载时 /api 还没有上游
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
