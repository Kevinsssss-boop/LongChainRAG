# Alembic configuration.
#
# The database schema has exactly one source of truth: the migrations under
# alembic/versions/. The app runs `upgrade head` on startup (see init_db in
# app/main.py) instead of create_all, so adding a column later upgrades an
# existing database in place rather than requiring you to delete it.
#
# WARNING -- keep this file ASCII-only.
# alembic reads it via configparser with encoding="locale". On a Chinese
# Windows install that is GBK, so non-ASCII comments here make alembic die
# with UnicodeDecodeError before it even starts. Chinese explanations live
# in alembic/env.py instead, which Python reads as UTF-8.

[alembic]
script_location = alembic

# Lets the `alembic` command import the app package when run from backend/.
# (env.py also inserts backend/ into sys.path explicitly, so running from the
# repository root works too.)
prepend_sys_path = .

# Migration filenames: date_time_revision_slug. Sorts chronologically in ls.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Deliberately empty. The real URL is loaded in alembic/env.py from
# app.config.settings. Keeping it in one place means it cannot drift.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
